<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALM TIDE Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-script">Palm Tide</span>
      <span class="brand-block">COVER STUDIO</span>
    </div>
    <div class="variants" role="group" aria-label="Cover variants">
      <button class="btn" data-variant="sunset" type="button">Sunset</button>
      <button class="btn" data-variant="neon" type="button">Neon Night</button>
      <button class="btn" data-variant="comic" type="button">Comic Ink</button>
    </div>
    <div class="exports">
      <button class="btn" id="undoBtn" type="button">Undo</button>
      <button class="btn" id="redoBtn" type="button">Redo</button>
      <button class="btn accent" id="exportBtn" type="button">Export PNG</button>
      <button class="btn accent" id="exportAllBtn" type="button">Export All 3 Sizes</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="tray panel">
      <h2>Photos</h2>
      <label class="btn block upload-btn">
        Add photos
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
      </label>
      <p class="hint">…or drop image files onto the cover.</p>
      <div id="thumbs" class="thumbs"></div>
      <h3>Selected photo</h3>
      <button class="btn block" id="fillAllBtn" type="button">Fill all panels with it</button>
      <button class="btn block" id="spreadBtn" type="button">Spread photos across panels</button>
      <p class="hint">Click a panel on the cover to select it. Drag to move its
      photo, scroll to zoom, double-click to reset the crop.</p>
    </aside>

    <section class="stage panel" id="stage">
      <canvas id="cover" width="1920" height="1080"></canvas>
    </section>

    <aside class="controls panel">
      <h2>Cover</h2>
      <label class="field">Layout
        <select id="layoutSel"></select>
      </label>
      <label class="field">Grade
        <select id="gradeSel"></select>
      </label>
      <label class="field">Export size
        <select id="sizeSel">
          <option value="landscape">Landscape · 1920×1080</option>
          <option value="square">Square · 1080×1080</option>
          <option value="portrait">Portrait · 1080×1350</option>
        </select>
      </label>

      <h3>Grade strength</h3>
      <label class="slider">Strength <input id="strengthR" type="range" min="0" max="1" step="0.01"></label>
      <label class="slider">Contrast <input id="contrastR" type="range" min="0.6" max="1.5" step="0.01"></label>
      <label class="slider">Saturation <input id="saturationR" type="range" min="0" max="2" step="0.01"></label>
      <label class="slider">Grain <input id="grainR" type="range" min="0" max="1" step="0.01"></label>
      <label class="slider">Vignette <input id="vignetteR" type="range" min="0" max="1" step="0.01"></label>
      <label class="check"><input id="halftoneC" type="checkbox"> Halftone dots</label>
      <label class="slider">Dots <input id="dotsR" type="range" min="0" max="1" step="0.01"></label>

      <h3>Words</h3>
      <label class="field">Title <input id="titleI" type="text"></label>
      <label class="field">Script subtitle <input id="subtitleI" type="text"></label>
      <label class="field">Tagline <input id="taglineI" type="text"></label>
      <label class="field">Quote <input id="quoteI" type="text"></label>
      <label class="field">Quote source <input id="sourceI" type="text"></label>
      <label class="field">Badge <input id="badgeI" type="text"></label>
      <label class="field">Ribbon <input id="ribbonI" type="text"></label>
      <label class="field">Volume tag <input id="volumeI" type="text"></label>
      <label class="field">Stars
        <select id="starsSel">
          <option>1</option><option>2</option><option>3</option>
          <option>4</option><option selected>5</option>
        </select>
      </label>

      <h3>Panel tag · <span id="tagPanelName">none</span></h3>
      <label class="field">Place <input id="tagPlaceI" type="text"></label>
      <label class="field">Time <input id="tagTimeI" type="text"></label>
      <label class="field">Sub-line <input id="tagSubI" type="text"></label>
    </aside>
  </main>
</div>
<script type="module" src="src/desk.js"></script>
</body>
</html>
